[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200

; Configurações obrigatórias para monitoramento via USB-C nativo
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; CONFIGURAÇÃO EXATA PARA A MEMÓRIA FLASH XMC (46 / 4016)
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.flash_size = 4MB

; === SUBPROJETO: ACCESS POINT ===
[env:ap]
extends = env
build_src_filter = +<ap/> -<router/>

; === SUBPROJETO: ROUTER ===
[env:router]
extends = env
build_src_filter = +<router/> -<ap/>
